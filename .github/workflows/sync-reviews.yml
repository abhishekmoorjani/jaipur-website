name: Sync Google Reviews

# Keeps the star rating, the review count and the testimonial carousel in step
# with what Google Maps actually shows.
#
# Runs the Playwright pipeline, which needs no Google account, no API key and
# no billing:
#   scrape-reviews.py          → reviews.json  (rating, Google's total, reviews)
#   translate-reviews.mjs      → carousel-reviews.json (50, DE/EN/FR, no photos)
#
# Weekly, at the owner's call. The rating itself barely moves at this review
# count, but the review COUNT is visible on the page and in the structured
# data, so a week is a reasonable staleness ceiling for a number a visitor can
# check against Google in one click.

# The weekly schedule is commented out on purpose, not forgotten.
#
# Google now serves a "limited view" of Maps to sessions it classifies as
# automated: the star rating renders but the review count, the review list and
# the Reviews tab are all withheld. This was reproduced from a residential
# German IP with headless Chrome, headed Chrome, the real Chrome binary and a
# warmed profile, all with the same result, so it is not an IP or a headless
# problem and there is no selector fix for it. The scrape therefore cannot
# succeed unattended, and a scheduled run would only email a failure every
# Monday.
#
# The pipeline itself is proven and left intact: translate, verification and
# commit all succeeded in CI. Re-enable the cron the moment
# the scrape works again, or trigger it by hand from the Actions tab when
# running somewhere Google trusts.
on:
  # schedule:
  #   - cron: '14 7 * * 1'
  workflow_dispatch:

# Only one sync at a time. Two overlapping runs would both push to main and the
# second would fail on a non fast-forward.
concurrency:
  group: sync-reviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install playwright
          playwright install --with-deps chromium

      # Writes src/data/reviews.json. Fails the run if Google's rating or total
      # review count cannot be read, rather than falling back to a stale
      # hardcoded figure, because those two numbers are published in the
      # aggregateRating structured data.
      - name: Scrape Google reviews
        run: python scrape-reviews.py

      # When the scrape fails it saves a full-page screenshot of what Google
      # actually served. Without this the only diagnosis available is guessing
      # at selectors.
      - name: Upload scrape failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-failure-screenshot
          path: scrape-failure.png
          if-no-files-found: ignore

      # Picks the best 50 and pre-translates them into DE, EN and FR.
      - name: Build the translated carousel
        run: node translate-reviews.mjs


      # Sanity gate before anything is committed. A silently wrong rating in
      # structured data is worse than a failed workflow run.
      - name: Verify the synced figures
        run: |
          node -e '
            const d = require("./src/data/reviews.json");
            const c = require("./src/data/carousel-reviews.json");
            const fail = (m) => { console.error("FAIL: " + m); process.exit(1); };
            // Freshness first. Checking only that the numbers are internally
            // consistent let a run pass that scraped nothing at all and simply
            // re-published five month old data, because stale data is
            // perfectly self-consistent. If the scrape did not write today,
            // the scrape did not happen.
            const today = new Date().toISOString().slice(0, 10);
            if (d.lastUpdated !== today) fail(
              `reviews.json lastUpdated is ${d.lastUpdated}, expected ${today}. The scrape did not write new data.`);
            if (!(d.rating >= 1 && d.rating <= 5)) fail(`rating out of range: ${d.rating}`);
            if (!(d.totalReviews > 0)) fail(`totalReviews missing: ${d.totalReviews}`);
            if (d.totalReviews < d.scrapedReviews) fail(
              `Google total (${d.totalReviews}) is below the scraped count (${d.scrapedReviews}), so totalReviews is not Googles figure`);
            if (!c.reviews?.length) fail("carousel is empty");
            // Reviewer photos are not published at all. Re-hosting one is a
            // reproduction under section 16 UrhG and section 72 UrhG protects
            // every photograph regardless of originality, so the card shows a
            // monogram instead. Fail if any photo comes back.
            const withPhoto = c.reviews.filter(r => r.profilePhoto).length;
            if (withPhoto) fail(`${withPhoto} reviews carry a profile photo, which must not be published`);
            console.log(`OK: ${d.rating} stars, ${d.totalReviews} total, ${c.reviews.length} in carousel`);
          '

      - name: Commit updated review data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only paths that exist. The previous version listed
          # public/images/gallery/, which is not in the repo, and git add fails
          # the whole run on a missing pathspec (exit 128).
          git add src/data/reviews.json src/data/carousel-reviews.json
          [ -d public/images/reviews ] && git add public/images/reviews || true
          git diff --cached --quiet || git commit -m "chore: sync Google reviews [automated]"
          # The scrape takes minutes, so main can move underneath the run. A
          # plain push then fails as a non fast-forward, which is how the
          # 2026-08-10 run lost a successful scrape at the very last step.
          # Rebase onto whatever landed meanwhile and retry.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "could not push after 3 attempts"; exit 1

      # No build or deploy step. Cloudflare Pages builds from main on push, so
      # the commit above is the deploy trigger.
